<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 지도</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8xuka0ypq6"></script>
</head>
<body style="margin:0">
<div id="map" style="height:100vh"></div>
<script>
var map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.5666, 126.9784),
  zoom: 12,
  mapTypeControl: true,
  mapTypeControlOptions: {
    style: naver.maps.MapTypeControlStyle.BUTTON,
    position: naver.maps.Position.TOP_RIGHT
// 컨트롤 버튼에 '일반'과 '하이브리드'만 표시되도록 설정
    mapTypeIds: [
      naver.maps.MapTypeId.NORMAL,
      naver.maps.MapTypeId.HYBRID
    ]    
  }  
});

naver.maps.Event.once(map, 'init', function () {
  map.data.setStyle({
    strokeColor: '#e33',
    strokeWeight: 3,
    strokeOpacity: 0.9,
    fillColor: '#e33',
    fillOpacity: 0.2
  });  
  
  fetch('Neseo.kml')
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var xml = new DOMParser().parseFromString(t, 'text/xml');
      map.data.addKml(xml);

      var bounds = new naver.maps.LatLngBounds();
      var n = 0;
      xml.querySelectorAll('coordinates').forEach(function (c) {
        c.textContent.trim().split(/\s+/).forEach(function (s) {
          var a = s.split(',');
          var lng = parseFloat(a[0]), lat = parseFloat(a[1]);
          if (!isNaN(lng) && !isNaN(lat)) {
            bounds.extend(new naver.maps.LatLng(lat, lng));
            n++;
          }
        });
      });
      console.log('KML 좌표 개수:', n);
      if (n > 0) map.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
    });
});
</script>
</body>
</html>
