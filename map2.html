<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 지도</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8xuka0ypq6"></script>
</head>
<body style="margin:0">
<div id="map" style="height:100vh"></div>
<script>
var map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.5666, 126.9784),
  zoom: 12
});

naver.maps.Event.once(map, 'init', function () {
  map.data.setStyle({
    strokeColor: '#e33',
    strokeWeight: 3,
    strokeOpacity: 0.9,
    fillColor: '#e33',
    fillOpacity: 0.2
  });  
  
  fetch('Neseo.kml')
    .then(function (r) { return r.text(); })
    .then(function (t) {
      map.data.addKml(new DOMParser().parseFromString(t, 'text/xml'));
    });
});
</script>
</body>
</html>
