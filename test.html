<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 지도 테스트</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=8xuka0ypq6"></script>
</head>
<body style="margin:0">
<div id="map" style="width:100%;height:100vh"></div>
<script>
  window.navermap_authFailure = function () {
    alert('인증 실패 / 현재 주소: ' + location.origin);
  };
  var map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(37.5666, 126.9784),
    zoom: 14
  });
  new naver.maps.Marker({ position: new naver.maps.LatLng(37.5666, 126.9784), map: map });
</script>
</body>
</html>
