<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>네이버 지도 KML/GPX 레이어</title>
    <!-- 네이버 지도 API 불러오기 -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?clientId=8xuka0ypq6"></script>
</head>
<body> 
    <div id="map" style="width:100%;height:600px;"></div>

    <script>
        // 1. 지도 생성
        var map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(37.5666805, 126.9784147),
            zoom: 12
        });

        // 2. KML 파일 불러오기
        // 외부 서버에 올린 KML 파일 URL 지정
        // map.data.addKml('https://example.com/path/to/your_file.kml');
        // map.data.addKml('https://junseok73.github.io/my-map-service/Neseo.kml');
        map.data.addKml('Neseo.kml');        
        // 만약 GPX 파일이라면 addGpx 메서드 사용
        // map.data.addGpx('https://example.com/path/to/your_file.gpx');
    </script>
</body>
</html>
