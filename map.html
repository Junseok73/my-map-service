<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>네이버 지도 KML 레이어 (예제 방식)</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8xuka0ypq6"></script>
</head>
<body style="margin:0">
    <div id="map" style="width:100%;height:100vh;"></div>

    <script>
        var map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(37.5666805, 126.9784147),
            zoom: 12
        });

        var HOME_PATH = window.HOME_PATH || '.';

        naver.maps.Event.once(map, 'init', function () {
            $.ajax({
                url: HOME_PATH + '/Neseo.kml',   // seorak.kml -> Neseo.kml
                dataType: 'xml',
                success: startDataLayer,
                error: function (xhr) { alert('KML 로드 실패: ' + xhr.status); }
            });
        });

        function startDataLayer(xmlDoc) {
            map.data.addKml(xmlDoc);

            // 선 굵기/색 (strokeWeight 숫자를 키우면 굵어짐)
            map.data.setStyle({
                strokeColor: '#e74c3c',
                strokeWeight: 4,
                strokeOpacity: 1,
                fillColor: '#e74c3c',
                fillOpacity: 0.3
            });

            // 데이터 위치로 지도 이동 (addKml 은 자동으로 이동하지 않음)
            var b = new naver.maps.LatLngBounds();
            var n = 0;
            Array.prototype.forEach.call(xmlDoc.getElementsByTagName('coordinates'), function (c) {
                c.textContent.trim().split(/\s+/).forEach(function (t) {
                    var a = t.split(',').map(Number);
                    if (!isNaN(a[0]) && !isNaN(a[1])) { b.extend(new naver.maps.LatLng(a[1], a[0])); n++; }
                });
            });
            if (n) map.fitBounds(b);
        }
    </script>
</body>
</html>
